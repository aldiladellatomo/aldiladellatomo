<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-key="home"></title>
    <meta name="description" content="Blog scientifico con articoli di discipline scientifiche e approfondimenti moderni." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-lang-path="https://raw.githubusercontent.com/aldiladellatomo/aldiladellatomo/main/lang/">
    <header>
      <div class="navbar">
        <nav class="nav-links" data-i18n-aria="navAria">
          <a class="nav-logo" href="home.html" data-i18n-key="home"></a>
          <a href="html/1.html" data-discipline="1" data-i18n-key="discipline1"></a>
          <a href="html/2.html" data-discipline="2" data-i18n-key="discipline2"></a>
          <a href="html/3.html" data-discipline="3" data-i18n-key="discipline3"></a>
          <a href="html/4.html" data-discipline="4" data-i18n-key="discipline4"></a>
        </nav>
        <div class="search-box">
          <input id="search-input" type="search" placeholder="" data-i18n-placeholder="searchPlaceholder" aria-label="" data-i18n-aria="searchLabel" />
          <button id="search-button" class="search-icon" type="button" aria-label="Search">🔎</button>
        </div>
        <div class="header-actions">
          <button id="theme-toggle" class="icon-toggle" type="button" aria-label="Toggle theme">🌙</button>
          <select id="lang-select" class="lang-select" aria-label="Select language">
            <option value="it">IT</option>
            <option value="en">EN</option>
          </select>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div>
          <h1 id="hero-title" data-i18n-key="heroTitleAll"></h1>
          <p id="hero-subtitle" data-i18n-key="heroSubtitleAll"></p>
        </div>
      </section>

      <section class="carousel" data-i18n-aria="carouselAria">
        <div class="carousel-inner" id="carousel-list"></div>
      </section>

      <section class="order-section">
        <div class="controls">
          <div class="info" id="carousel-info" data-i18n-key="latest"></div>
          <select id="sort-select" data-i18n-aria="sortAria">
            <option value="alpha-asc" data-i18n-key="orderAZ"></option>
            <option value="alpha-desc" data-i18n-key="orderZA"></option>
            <option value="date-new" data-i18n-key="orderNewest"></option>
            <option value="date-old" data-i18n-key="orderOldest"></option>
          </select>
        </div>
      </section>

      <section class="list-grid">
        <div class="controls">
          <div class="info" id="results-info" data-i18n-key="loading"></div>
        </div>
        <div id="article-list"></div>
      </section>
    </main>

    <footer class="page-footer">
      <div class="footer-bar">
        <a class="footer-link" href="https://github.com/aldiladellatomo" target="_blank" rel="noopener" data-i18n-key="footerGitHub"></a>
        <a class="footer-link" href="mailto:info@aldiladellatomo.com" data-i18n-key="footerEmail"></a>
      </div>
    </footer>

    <script src="script/common.js"></script>
    <script src="script/app.js"></script>
  </body>
</html>
