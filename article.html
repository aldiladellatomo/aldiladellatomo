<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Aldilà dell'atomo</title>
    <meta name="description" content="Articolo scientifico." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="navbar">
        <a class="nav-logo" href="home.html" data-i18n-key="home">Aldilà dell'atomo</a>
        <div class="nav-links" aria-label="Navigazione principale">
          <a href="fisica.html" data-discipline="fisica" data-i18n-key="fisica">Fisica</a>
          <a href="matematica.html" data-discipline="matematica" data-i18n-key="matematica">Matematica</a>
          <a href="chimica.html" data-discipline="chimica" data-i18n-key="chimica">Chimica</a>
          <a href="biologia.html" data-discipline="biologia" data-i18n-key="biologia">Biologia</a>
        </div>
        <div class="search-group">
          <input id="search-input" type="search" placeholder="Cerca articoli..." aria-label="Cerca articoli" data-i18n-placeholder="searchPlaceholder" />
          <button id="search-button" type="button" data-i18n-key="searchButton">Cerca</button>
        </div>
        <div class="toggle-group">
          <label class="switch">
            <input id="theme-toggle" type="checkbox" />
            <span class="slider"></span>
            <span class="switch-text" data-i18n-key="darkMode">Tema scuro</span>
          </label>
          <label class="switch">
            <input id="lang-toggle" type="checkbox" />
            <span class="slider"></span>
            <span class="switch-text" data-i18n-key="language">English</span>
          </label>
        </div>
      </div>
    </header>

    <main>
      <section class="article-detail">
        <div class="article-meta-wrap">
          <div class="meta">
            <span id="article-discipline" class="discipline tag"></span>
            <span id="article-date"></span>
          </div>
          <h1 id="article-title">Titolo articolo</h1>
          <p id="article-description">Descrizione articolo.</p>
          <p><strong data-i18n-key="keywords">Parole chiave</strong>: <span id="article-keywords-list"></span></p>
          <a id="back-home" class="back-link" href="home.html" data-i18n-key="backHome">Torna alla home</a>
        </div>
        <div class="article-content" id="article-content"></div>
      </section>
    </main>

    <script src="script/common.js"></script>
    <script src="script/article.js"></script>
  </body>
</html>
