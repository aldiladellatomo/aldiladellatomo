<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Maker — Al di là dell'atomo</title>
  <link rel="stylesheet" href="/core/style.css">
  <link id="favicon" rel="icon" type="image/svg+xml" href="/images/a0.svg">
</head>
<body class="ba0">

  <header>
    <div class="editor-brand" onclick="window.location.href='index.html'">⚛️ Article Maker</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button onclick="window.location.href='/home.html'">🏠 Vai al Sito</button>
      <button onclick="fetchRemoteData()">🔄 Aggiorna</button>
    </div>
  </header>

  <main class="editor-container">
    <div class="editor-status-banner">
      <span id="status-text">Caricamento articoli...</span>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <!-- Tasto Carica file JSON articolo -->
        <label style="cursor:pointer; text-decoration:underline; font-size:0.85rem; font-weight:700;">
          📁 Carica JSON Articolo
          <input type="file" accept=".json" style="display:none" onchange="uploadArticleJson(event)">
        </label>
        <label style="cursor:pointer; text-decoration:underline; font-size:0.85rem;">
          Importa articles.json
          <input type="file" accept=".json" style="display:none" onchange="importLocalArticlesJson(event)">
        </label>
      </div>
    </div>

    <div class="editor-card">
      <div class="editor-toolbar">
        <input type="text" id="home-search" placeholder="Cerca articolo per titolo, ID o tag..." oninput="renderHomeList()">
        <select id="home-filter-class" onchange="renderHomeList()">
          <option value="all">Tutte le materie</option>
          <option value="a1">Fisica (a1)</option>
          <option value="a2">Matematica (a2)</option>
          <option value="a3">Chimica (a3)</option>
          <option value="a4">Biologia (a4)</option>
        </select>
      </div>

      <div id="articles-list" class="editor-article-list"></div>
    </div>

    <button class="fab-add" title="Crea nuovo articolo" onclick="window.location.href='edit.html?id=new'">+</button>
  </main>

  <script src="/core/script.js"></script>
  <script src="home.js"></script>
</body>
</html>
