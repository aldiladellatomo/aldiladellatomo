<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matematica - Aldilà dell'atomo</title>
    <meta name="description" content="Articoli di matematica e concetti scientifici." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-default-discipline="matematica">
    <header>
      <div class="navbar">
        <a class="nav-logo" href="home.html" data-i18n-key="home">Aldilà dell'atomo</a>
        <div class="nav-links" aria-label="Navigazione principale">
          <a href="fisica.html" data-discipline="fisica" data-i18n-key="fisica">Fisica</a>
          <a href="matematica.html" data-discipline="matematica" data-i18n-key="matematica">Matematica</a>
          <a href="chimica.html" data-discipline="chimica" data-i18n-key="chimica">Chimica</a>
          <a href="biologia.html" data-discipline="biologia" data-i18n-key="biologia">Biologia</a>
        </div>
        <div class="search-group">
          <input id="search-input" type="search" placeholder="Cerca articoli..." aria-label="Cerca articoli" data-i18n-placeholder="searchPlaceholder" />
          <button id="search-button" type="button" data-i18n-key="searchButton">Cerca</button>
        </div>
        <div class="toggle-group">
          <label class="switch">
            <input id="theme-toggle" type="checkbox" />
            <span class="slider"></span>
            <span class="switch-text" data-i18n-key="darkMode">Tema scuro</span>
          </label>
          <label class="switch">
            <input id="lang-toggle" type="checkbox" />
            <span class="slider"></span>
            <span class="switch-text" data-i18n-key="language">English</span>
          </label>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div>
          <h1 id="hero-title">Articoli di Matematica</h1>
          <p id="hero-subtitle">Teorie, esempi e curiosità legate al mondo della matematica.</p>
        </div>
      </section>

      <section class="carousel" aria-label="Articoli recenti">
        <div class="carousel-inner" id="carousel-list"></div>
      </section>

      <section class="order-section">
        <div class="controls">
          <div class="info" id="carousel-info" data-i18n-key="latest">Carosello con gli ultimi 3 articoli pubblicati.</div>
          <div class="actions">
            <select id="sort-select" aria-label="Ordina gli articoli">
              <option value="asc" data-i18n-key="orderAZ">Ordina A → Z</option>
              <option value="desc" data-i18n-key="orderZA">Ordina Z → A</option>
            </select>
            <button id="order-button" type="button" data-i18n-key="orderAZ">Ordina A → Z</button>
          </div>
        </div>
      </section>

      <section class="list-grid">
        <div class="controls">
          <div class="info" id="results-info" data-i18n-key="loading">Caricamento articoli...</div>
        </div>
        <div id="article-list"></div>
      </section>
    </main>

    <script src="script/common.js"></script>
    <script src="script/app.js"></script>
  </body>
</html>
