<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title" data-i18n-key="home"></title>
    <meta name="description" content="Articolo scientifico." />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body data-lang-path="../lang/">
    <header>
      <div class="navbar">
        <a class="nav-logo" href="../home.html" data-i18n-key="home"></a>
        <nav class="nav-links" data-i18n-aria="navAria">
          <a href="1.html" data-discipline="1" data-i18n-key="discipline1"></a>
          <a href="2.html" data-discipline="2" data-i18n-key="discipline2"></a>
          <a href="3.html" data-discipline="3" data-i18n-key="discipline3"></a>
          <a href="4.html" data-discipline="4" data-i18n-key="discipline4"></a>
        </nav>
        <div class="search-box">
          <input id="search-input" type="search" placeholder="" data-i18n-placeholder="searchPlaceholder" aria-label="" data-i18n-aria="searchLabel" />
          <button id="search-button" type="button"><span class="button-icon">🔎</span><span data-i18n-key="searchButton"></span></button>
        </div>
        <div class="toggle-group">
          <label class="switch">
            <span class="switch-icon">🌙</span>
            <input id="theme-toggle" type="checkbox" />
            <span class="slider"></span>
            <span class="switch-text" data-i18n-key="darkMode"></span>
          </label>
          <label class="switch">
            <span class="switch-icon">🌐</span>
            <input id="lang-toggle" type="checkbox" />
            <span class="slider"></span>
            <span class="switch-text" data-i18n-key="language"></span>
          </label>
        </div>
      </div>
    </header>

    <main>
      <section class="article-detail">
        <div class="article-meta-wrap">
          <div class="meta">
            <span id="article-discipline" class="discipline tag"></span>
            <span id="article-date"></span>
          </div>
          <h1 id="article-title" data-i18n-key="articleTitlePlaceholder"></h1>
          <p id="article-description" data-i18n-key="articleDescriptionPlaceholder"></p>
          <p><strong data-i18n-key="keywords"></strong>: <span id="article-keywords-list"></span></p>
          <a id="back-home" class="back-link" href="../home.html" data-i18n-key="backHome"></a>
        </div>
        <div class="article-content" id="article-content"></div>
      </section>

    </main>

    <script src="../script/common.js"></script>
    <script src="../script/article.js"></script>
  </body>
</html>
