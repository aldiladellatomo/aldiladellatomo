<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-key="subjectTitle1"></title>
    <meta name="description" content="Pagina di disciplina con articoli e attività scientifiche." />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body data-default-discipline="1" data-lang-path="../lang/">
    <header>
      <div class="navbar">
        <a class="nav-logo" href="../home.html" data-i18n-key="home"></a>
        <nav class="nav-links" data-i18n-aria="navAria">
          <a href="1.html" data-discipline="1" data-i18n-key="discipline1"></a>
          <a href="2.html" data-discipline="2" data-i18n-key="discipline2"></a>
          <a href="3.html" data-discipline="3" data-i18n-key="discipline3"></a>
          <a href="4.html" data-discipline="4" data-i18n-key="discipline4"></a>
        </nav>
        <div class="search-box">
          <input id="search-input" type="search" placeholder="" data-i18n-placeholder="searchPlaceholder" aria-label="" data-i18n-aria="searchLabel" />
          <button id="search-button" type="button"><span class="button-icon">🔎</span><span data-i18n-key="searchButton"></span></button>
        </div>
        <div class="toggle-group">
          <label class="switch">
            <span class="switch-icon">🌙</span>
            <input id="theme-toggle" type="checkbox" />
            <span class="slider"></span>
            <span class="switch-text" data-i18n-key="darkMode"></span>
          </label>
          <label class="switch">
            <span class="switch-icon">🌐</span>
            <input id="lang-toggle" type="checkbox" />
            <span class="slider"></span>
            <span class="switch-text" data-i18n-key="language"></span>
          </label>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div>
          <h1 id="hero-title" data-i18n-key="heroTitleDiscipline"></h1>
          <p id="hero-subtitle" data-i18n-key="heroSubtitleDiscipline"></p>
        </div>
      </section>

      <section class="carousel" data-i18n-aria="carouselAria">
        <div class="carousel-inner" id="carousel-list"></div>
      </section>

      <section class="order-section">
        <div class="controls">
          <div class="info" id="carousel-info" data-i18n-key="latest"></div>
          <div class="actions">
            <select id="sort-select" data-i18n-aria="sortAria">
              <option value="asc" data-i18n-key="orderAZ"></option>
              <option value="desc" data-i18n-key="orderZA"></option>
            </select>
            <button id="order-button" type="button" data-i18n-key="orderAZ"></button>
          </div>
        </div>
      </section>

      <section class="list-grid">
        <div class="controls">
          <div class="info" id="results-info" data-i18n-key="loading"></div>
        </div>
        <div id="article-list"></div>
      </section>
    </main>

    <script src="../script/common.js"></script>
    <script src="../script/app.js"></script>
  </body>
</html>
